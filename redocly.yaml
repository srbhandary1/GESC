apis:
  global-english@v1:
    root: ./docs/api/openapi.yaml

extends:
  - recommended-strict

rules:
  # scripts/validate-openapi-policy.mjs requires explicit 4xx responses for
  # every non-health operation. It also enforces RFC 9457 media types for
  # versioned domain APIs while preserving standards-based OAuth JSON errors
  # on the root Passport endpoints.
  operation-4xx-response: off
  operation-4xx-problem-details-rfc7807: off
  spec-strict-refs: error
