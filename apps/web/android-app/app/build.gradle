apply plugin: 'com.android.application'

def releaseSigningValues = [
    storeFile: System.getenv('GE_ANDROID_UPLOAD_STORE_FILE'),
    storePassword: System.getenv('GE_ANDROID_UPLOAD_STORE_PASSWORD'),
    keyAlias: System.getenv('GE_ANDROID_UPLOAD_KEY_ALIAS'),
    keyPassword: System.getenv('GE_ANDROID_UPLOAD_KEY_PASSWORD'),
].collectEntries { key, value -> [key, value?.trim()] }
def releaseSigningPresent = releaseSigningValues.values().every { it }
def releaseSigningAbsent = releaseSigningValues.values().every { !it }
def mobileApiOrigin = System.getenv('VITE_MOBILE_API_ORIGIN')?.trim() ?: ''
def mobileApiOriginLiteral = mobileApiOrigin
    .replace('\\', '\\\\')
    .replace('"', '\\"')
ext.isAllowedMobileApiOrigin = { String origin ->
    try {
        def uri = URI.create(origin)
        if (uri.userInfo != null) {
            return false
        }

        def path = uri.path ?: ''
        if (path != '' && path != '/') {
            return false
        }
        if (uri.query != null || uri.fragment != null) {
            return false
        }

        def host = uri.host
        if (host == null || host.isEmpty()) {
            return false
        }
        if (uri.scheme == 'https') {
            return true
        }
        if (uri.scheme != 'http') {
            return false
        }
        if (['10.0.2.2', '127.0.0.1', 'localhost'].contains(host)) {
            return true
        }

        def port = uri.port == -1 ? 80 : uri.port
        def ipv4Host = /^(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)(?:\.(?:25[0-5]|2[0-4]\d|1\d\d|[1-9]?\d)){3}$/
        return port == 8080 && host ==~ ipv4Host
    } catch (Exception ignored) {
        return false
    }
}

if (!releaseSigningPresent && !releaseSigningAbsent) {
    throw new GradleException('Android release signing is incomplete. Set all four GE_ANDROID_UPLOAD_* variables or unset all of them.')
}

if (releaseSigningPresent) {
    def configuredUploadStore = new File(releaseSigningValues.storeFile)
    if (!configuredUploadStore.isAbsolute()) {
        throw new GradleException('GE_ANDROID_UPLOAD_STORE_FILE must be an absolute path outside the repository.')
    }

    def uploadStore = configuredUploadStore.canonicalFile
    def repositoryRoot = rootProject.projectDir.toPath().resolve('../../..').normalize().toFile().canonicalFile

    if (!uploadStore.isFile()) {
        throw new GradleException('GE_ANDROID_UPLOAD_STORE_FILE does not identify a readable keystore file.')
    }
    if (uploadStore.toPath().startsWith(repositoryRoot.toPath())) {
        throw new GradleException('The Android upload keystore must be stored outside the repository.')
    }
}

android {
    namespace = "com.globalenglish.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.globalenglish.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "MOBILE_API_ORIGIN", "\"${mobileApiOriginLiteral}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        if (releaseSigningPresent) {
            release {
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseSigningPresent) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    def packagingRequested = graph.allTasks.any { task ->
        task.project == project && (
            task.name.toLowerCase().contains('assemble') ||
            task.name.toLowerCase().contains('bundle')
        )
    }

    if (releaseRequested && !releaseSigningPresent) {
        throw new GradleException('Release APK/AAB creation requires the four GE_ANDROID_UPLOAD_* signing variables. Debug builds remain available without them.')
    }

    // Production APK packaging requires a baked API origin so Custom Tabs
    // cannot ship with an empty BuildConfig.MOBILE_API_ORIGIN (D-0262).
    if (packagingRequested && !isAllowedMobileApiOrigin(mobileApiOrigin)) {
        throw new GradleException('Set VITE_MOBILE_API_ORIGIN to the absolute API origin reachable from the device before assemble/bundle. An empty origin makes every Sign in tap fail closed in Custom Tabs.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.browser:browser:1.8.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
