def appRelease = new groovy.json.JsonSlurper().parse(rootProject.file('../src/appRelease.json'))

apply plugin: 'com.android.application'

def releaseSigningValues = [
    storeFile: System.getenv('GE_ANDROID_UPLOAD_STORE_FILE'),
    storePassword: System.getenv('GE_ANDROID_UPLOAD_STORE_PASSWORD'),
    keyAlias: System.getenv('GE_ANDROID_UPLOAD_KEY_ALIAS'),
    keyPassword: System.getenv('GE_ANDROID_UPLOAD_KEY_PASSWORD'),
].collectEntries { key, value -> [key, value?.trim()] }
def releaseSigningPresent = releaseSigningValues.values().every { it }
def releaseSigningAbsent = releaseSigningValues.values().every { !it }
def mobileApiOrigin = System.getenv('VITE_MOBILE_API_ORIGIN')?.trim() ?: ''
def mobileApiOriginLiteral = mobileApiOrigin
    .replace('\\', '\\\\')
    .replace('"', '\\"')

if (!releaseSigningPresent && !releaseSigningAbsent) {
    throw new GradleException('Android release signing is incomplete. Set all four GE_ANDROID_UPLOAD_* variables or unset all of them.')
}

if (releaseSigningPresent) {
    def configuredUploadStore = new File(releaseSigningValues.storeFile)
    if (!configuredUploadStore.isAbsolute()) {
        throw new GradleException('GE_ANDROID_UPLOAD_STORE_FILE must be an absolute path outside the repository.')
    }

    def uploadStore = configuredUploadStore.canonicalFile
    def repositoryRoot = rootProject.projectDir.toPath().resolve('../../..').normalize().toFile().canonicalFile

    if (!uploadStore.isFile()) {
        throw new GradleException('GE_ANDROID_UPLOAD_STORE_FILE does not identify a readable keystore file.')
    }
    if (uploadStore.toPath().startsWith(repositoryRoot.toPath())) {
        throw new GradleException('The Android upload keystore must be stored outside the repository.')
    }
}

android {
    namespace = "com.globalenglish.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.globalenglish.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appRelease.versionCode
        versionName appRelease.versionName
        buildConfigField "String", "MOBILE_API_ORIGIN", "\"${mobileApiOriginLiteral}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig = true
    }
    signingConfigs {
        debug {
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
        if (releaseSigningPresent) {
            release {
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                storeFile file(releaseSigningValues.storeFile)
                storePassword releaseSigningValues.storePassword
                keyAlias releaseSigningValues.keyAlias
                keyPassword releaseSigningValues.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningPresent) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }

    if (releaseRequested && !releaseSigningPresent) {
        throw new GradleException('Release APK/AAB creation requires the four GE_ANDROID_UPLOAD_* signing variables. Debug builds remain available without them.')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    implementation "androidx.browser:browser:1.8.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:$androidxUiAutomatorVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
