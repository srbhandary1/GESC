<!doctype html>
<html lang="kn-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Kannada-guided spoken-English platform"
    />
    <meta name="theme-color" content="#006B3F" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/brand/gsea-1.jpeg" />
    <title>Global Spoken English App</title>
    <script>
      ;(function applyStoredInterfaceTheme() {
        var storageKey = 'ge-interface-theme-preference-v2'
        var preference = localStorage.getItem(storageKey) || 'light'
        var prefersDark =
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        var resolved =
          preference === 'dark' ||
          (preference === 'system' && prefersDark)
            ? 'dark'
            : 'light'
        document.documentElement.dataset.geTheme = resolved
        document.documentElement.dataset.geThemePreference = preference
        document.documentElement.style.colorScheme = resolved
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) {
          themeColor.setAttribute(
            'content',
            resolved === 'light' ? '#006B3F' : '#0B1210',
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
