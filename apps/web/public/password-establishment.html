<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="referrer" content="same-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set up your Global Spoken English account</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
      body { background: #f4f6f8; color: #17202a; margin: 0; }
      main { margin: 2rem auto; max-width: 38rem; padding: 0 1rem 4rem; }
      form, .notice { background: white; border: 1px solid #ccd4dc; border-radius: .6rem; margin: 1rem 0; padding: 1rem; }
      .notice { border-left: .4rem solid #9b6b00; }
      label { display: block; font-weight: 650; margin-top: 1rem; }
      input { box-sizing: border-box; font: inherit; padding: .55rem; width: 100%; }
      button { background: #173f78; border: 0; border-radius: .35rem; color: white; font: inherit; margin-top: 1rem; padding: .7rem 1rem; width: 100%; }
      button:disabled { opacity: .5; }
      .error { color: #a01818; font-weight: 650; }
      .success { color: #12662d; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>Set up your account</h1>
      <div class="notice">
        Localhost-only protected setup. The one-time token stays server-side and nothing is stored in browser storage.
        Choose your own username and password. Do not share either value.
      </div>
      <form id="form">
        <p id="availability">Checking protected delivery…</p>
        <p id="hint"></p>
        <label for="username">Username</label>
        <input id="username" autocomplete="username" maxlength="64" pattern="[a-zA-Z][a-zA-Z0-9._-]{3,63}" required spellcheck="false" />
        <label for="password">Password (15 to 128 characters)</label>
        <input id="password" autocomplete="new-password" minlength="15" maxlength="128" required type="password" />
        <label><input id="show" type="checkbox" style="width:auto" /> Show password</label>
        <button id="submit" disabled type="submit">Set username and password</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
      <p><a href="/">Return to sign in</a></p>
    </main>
    <script>
      'use strict'
      const elements = Object.fromEntries(['form', 'availability', 'hint', 'username', 'password', 'show', 'submit', 'message'].map((id) => [id, document.getElementById(id)]))
      let challengeId = null
      let token = null
      elements.show.addEventListener('change', () => { elements.password.type = elements.show.checked ? 'text' : 'password' })
      elements.form.addEventListener('submit', establish)
      addEventListener('beforeunload', clearSecrets)
      load()

      async function load() {
        const fragment = new URLSearchParams(location.hash.slice(1))
        const linkedChallenge = fragment.get('challenge_id')
        const linkedToken = fragment.get('token')
        if (linkedChallenge !== null || linkedToken !== null) history.replaceState(null, '', location.pathname + location.search)
        if (/^[0-9A-HJKMNP-TV-Z]{26}$/.test(linkedChallenge || '') && (linkedToken || '').length >= 32 && (linkedToken || '').length <= 256) {
          challengeId = linkedChallenge
          token = linkedToken
          elements.availability.textContent = 'This one-time setup link expires 15 minutes after it was sent.'
          elements.hint.textContent = 'Choose credentials only for your own verified account.'
          elements.submit.disabled = false
          return
        }
        try {
          const response = await fetch('/api/v1/local/password-establishment', { credentials: 'include', headers: { Accept: 'application/json' } })
          if (!response.ok) throw await responseError(response)
          const body = await response.json()
          if (body.delivery === null) throw new Error('No active protected establishment delivery is available.')
          challengeId = body.delivery.challenge_id
          elements.availability.textContent = `Delivery expires: ${body.delivery.expires_at}`
          elements.hint.textContent = `Verified contact: ${body.delivery.recovery_hint}`
          elements.submit.disabled = false
        } catch (error) { setMessage(safeError(error), 'error') }
      }

      async function establish(event) {
        event.preventDefault()
        if (challengeId === null) return
        elements.submit.disabled = true
        setMessage('Establishing credentials…')
        try {
          await ensureCsrf()
          const publicSetup = token !== null
          const response = await fetch(publicSetup ? '/api/v1/auth/password/setups' : '/api/v1/local/password-establishment', {
            method: 'POST', credentials: 'include',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json', 'X-XSRF-TOKEN': xsrfToken() },
            body: JSON.stringify({ challenge_id: challengeId, username: elements.username.value, ...(publicSetup ? { token } : {}), password: elements.password.value }),
          })
          if (!response.ok) throw await responseError(response)
          clearSecrets()
          elements.form.reset()
          elements.availability.textContent = 'Credential establishment completed. Sign in through the main app.'
          setMessage('Username and password established. The protected delivery was removed.', 'success')
        } catch (error) {
          elements.password.value = ''
          elements.submit.disabled = false
          setMessage(safeError(error), 'error')
        }
      }

      function clearSecrets() { elements.password.value = ''; challengeId = null; token = null }
      async function ensureCsrf() { const response = await fetch('/sanctum/csrf-cookie', { credentials: 'include', headers: { Accept: 'application/json' } }); if (!response.ok && response.status !== 204) throw new Error('Secure form initialization failed.') }
      function xsrfToken() { const pair = document.cookie.split('; ').find((item) => item.startsWith('XSRF-TOKEN=')); return pair ? decodeURIComponent(pair.slice('XSRF-TOKEN='.length)) : '' }
      async function responseError(response) { let message = `Request failed (${response.status}).`; try { const body = await response.json(); message = body.message || Object.values(body.errors || {}).flat()[0] || message } catch {}; return new Error(message) }
      function safeError(error) { return error instanceof Error ? error.message : 'Credential establishment could not be completed.' }
      function setMessage(message, kind = '') { elements.message.textContent = message; elements.message.className = kind }
    </script>
  </body>
</html>
