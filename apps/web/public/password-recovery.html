<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recover your Global Spoken English App account</title>
    <style>
      :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; }
      body { background: #f4f6f8; color: #17202a; margin: 0; }
      main { margin: 2rem auto; max-width: 38rem; padding: 0 1rem 4rem; }
      form, .notice { background: white; border: 1px solid #ccd4dc; border-radius: .6rem; margin: 1rem 0; padding: 1rem; }
      .notice { border-left: .4rem solid #9b6b00; }
      label { display: block; font-weight: 650; margin-top: 1rem; }
      input { box-sizing: border-box; font: inherit; padding: .55rem; width: 100%; }
      button { background: #173f78; border: 0; border-radius: .35rem; color: white; font: inherit; margin-top: 1rem; padding: .7rem 1rem; width: 100%; }
      button:disabled { opacity: .5; }
      .error { color: #a01818; font-weight: 650; }
      .success { color: #12662d; font-weight: 650; }
    </style>
  </head>
  <body>
    <main>
      <h1>Recover your account</h1>
      <div class="notice">
        Use this form only for your own account. The one-time token is removed from the address bar immediately and is never stored in browser storage.
      </div>
      <form id="form">
        <p id="availability">Checking recovery link…</p>
        <label for="username">Username</label>
        <input id="username" autocomplete="username" maxlength="64" pattern="[a-zA-Z][a-zA-Z0-9._-]{3,63}" required spellcheck="false" />
        <label for="password">New password (15 to 128 characters)</label>
        <input id="password" autocomplete="new-password" minlength="15" maxlength="128" required type="password" />
        <label for="confirmation">Confirm new password</label>
        <input id="confirmation" autocomplete="new-password" minlength="15" maxlength="128" required type="password" />
        <label><input id="show" type="checkbox" style="width:auto" /> Show passwords</label>
        <button id="submit" disabled type="submit">Set new password</button>
        <p id="message" role="status" aria-live="polite"></p>
      </form>
      <p><a href="/">Return to sign in</a></p>
    </main>
    <script>
      'use strict'
      const elements = Object.fromEntries(['form', 'availability', 'username', 'password', 'confirmation', 'show', 'submit', 'message'].map((id) => [id, document.getElementById(id)]))
      let challengeId = null
      let token = null
      elements.show.addEventListener('change', () => { const type = elements.show.checked ? 'text' : 'password'; elements.password.type = type; elements.confirmation.type = type })
      elements.form.addEventListener('submit', recover)
      addEventListener('beforeunload', clearSecrets)
      load()

      function load() {
        const fragment = new URLSearchParams(location.hash.slice(1))
        challengeId = fragment.get('challenge_id')
        token = fragment.get('token')
        if (challengeId !== null || token !== null) history.replaceState(null, '', location.pathname + location.search)
        if (!/^[0-9A-HJKMNP-TV-Z]{26}$/.test(challengeId || '') || (token || '').length < 32 || (token || '').length > 256) {
          clearSecrets()
          setMessage('This recovery link is missing or invalid. Request a new link from sign in.', 'error')
          return
        }
        elements.availability.textContent = 'This one-time recovery link expires 15 minutes after it was sent.'
        elements.submit.disabled = false
      }

      async function recover(event) {
        event.preventDefault()
        if (challengeId === null || token === null) return
        if (elements.password.value !== elements.confirmation.value) { setMessage('The passwords do not match.', 'error'); return }
        elements.submit.disabled = true
        setMessage('Recovering account…')
        try {
          await ensureCsrf()
          const response = await fetch('/api/v1/auth/password/recoveries', {
            method: 'POST', credentials: 'include',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json', 'X-XSRF-TOKEN': xsrfToken() },
            body: JSON.stringify({ challenge_id: challengeId, username: elements.username.value, token, new_password: elements.password.value }),
          })
          if (!response.ok) throw await responseError(response)
          clearSecrets()
          elements.form.reset()
          elements.availability.textContent = 'Recovery completed. Sign in with your new password.'
          setMessage('Your password has been changed and existing sessions were signed out.', 'success')
        } catch (error) {
          elements.password.value = ''
          elements.confirmation.value = ''
          elements.submit.disabled = false
          setMessage(safeError(error), 'error')
        }
      }

      function clearSecrets() { elements.password.value = ''; elements.confirmation.value = ''; challengeId = null; token = null }
      async function ensureCsrf() { const response = await fetch('/sanctum/csrf-cookie', { credentials: 'include', headers: { Accept: 'application/json' } }); if (!response.ok && response.status !== 204) throw new Error('Secure form initialization failed.') }
      function xsrfToken() { const pair = document.cookie.split('; ').find((item) => item.startsWith('XSRF-TOKEN=')); return pair ? decodeURIComponent(pair.slice('XSRF-TOKEN='.length)) : '' }
      async function responseError(response) { let message = `Request failed (${response.status}).`; try { const body = await response.json(); message = body.message || Object.values(body.errors || {}).flat()[0] || message } catch {}; return new Error(message) }
      function safeError(error) { return error instanceof Error ? error.message : 'Password recovery could not be completed.' }
      function setMessage(message, kind = '') { elements.message.textContent = message; elements.message.className = kind }
    </script>
  </body>
</html>
