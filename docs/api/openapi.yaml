openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Global English API
  version: 0.9.0
  description: |
    Canonical API contract for the Global English platform. Confidence
    Conversation Step A2 generalizes priority corrections to explanation_l1
    for all Phase 1 UI locales while keeping conversation/speech paths on
    deterministic local adapters unless separately configured. Authoritative
    learning records remain deterministic and are never mutated by AI output.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same-origin API
tags:
  - name: Health
    description: Public liveness and dependency-readiness checks.
  - name: Authentication
    description: Same-origin web session and mobile-family lifecycle.
  - name: Identity
    description: Authenticated user and active-membership context.
  - name: Tenancy
    description: Institution membership operations with server-derived scope.
  - name: Learning
    description: |
      Tenant-scoped onboarding, exact-pinned mission delivery, deterministic
      formative attempts, mastery projection and review scheduling.
  - name: Conversation
    description: |
      Tenant-scoped PR-008 Friend prototype using deterministic local/testing
      fake STT, conversation-model and text-only TTS adapters.
  - name: Voice
    description: |
      Tenant-scoped PR-009 consent, secure PCM/WAV recording, transcript review
      and verifiable deletion. No reviewed live STT/TTS provider is configured.
  - name: Memory
    description: |
      Tenant-scoped learner-visible AI memory facts with explicit create, edit
      and delete. Facts are purpose-bound and never hidden from the learner.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process can respond
      tags:
        - Health
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The API process is live.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required platform dependencies are available
      tags:
        - Health
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: All required platform dependencies are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required platform dependency is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Retry-After:
              description: Suggested minimum delay before another readiness check.
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/Problem"
  /oauth/authorize:
    get:
      operationId: beginMobileAuthorization
      summary: Begin first-party Android authorization
      description: |
        Opens only in the system browser for a registered public Android
        client. State and an S256 PKCE challenge are mandatory. The server
        validates the registered redirect URI and never accepts a client
        secret for this flow.
      tags:
        - Authentication
      servers:
        - url: /
          description: Standards-based Passport authorization endpoint.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 512
        - name: scope
          in: query
          required: true
          schema:
            type: string
            const: "mobile:api"
      responses:
        "200":
          description: Server-controlled sign-in or authorization HTML.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/html:
              schema:
                type: string
        "302":
          description: |
            Redirect to server-controlled sign-in or to the exact registered
            Android callback URI after approval or denial.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/OAuthProblem"
  /oauth/token:
    post:
      operationId: exchangeMobileToken
      summary: Exchange or rotate first-party Android credentials
      description: |
        Android-only public-client endpoint. Authorization codes require the
        original PKCE verifier. Refresh credentials are single-use and rotate
        on success. Access tokens expire after 15 minutes; a refresh family
        expires after 30 days of inactivity or 90 days absolute. The
        installation ULID is required for issuance and every refresh. Client
        authentication is prohibited: neither a client_secret parameter nor an
        Authorization header is accepted.
      tags:
        - Authentication
      servers:
        - url: /
          description: Standards-based Passport token endpoint.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MobileAuthorizationCodeExchange"
                - $ref: "#/components/schemas/MobileRefreshTokenExchange"
      responses:
        "200":
          description: A new access token and single-use refresh credential.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              required: true
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "400":
          $ref: "#/components/responses/OAuthProblem"
        "401":
          $ref: "#/components/responses/OAuthProblem"
        "429":
          $ref: "#/components/responses/OAuthProblem"
        default:
          $ref: "#/components/responses/OAuthProblem"
  /auth/otp/requests:
    post:
      operationId: requestOtp
      summary: Request a short-lived local OTP challenge
      description: |
        Always returns the same accepted shape so callers cannot determine
        whether the normalized mobile number already belongs to an identity.
        PR-003 uses only the fake/local OTP adapter.
      tags:
        - Authentication
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: The challenge request was accepted.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/otp/verifications:
    post:
      operationId: verifyOtp
      summary: Verify an OTP and create a web session
      description: |
        Consumes the challenge once and establishes a same-origin Sanctum
        cookie session. When institution_invite_code is omitted, the verified
        identity is assigned to Global English Direct. When it is present, the
        verified identity accepts that institution invite transactionally and
        receives no automatic Direct membership. Invite availability is not
        disclosed by the public error response. The response never contains
        the cookie credential.
      tags:
        - Authentication
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: The challenge was verified and a web session was created.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logoutWebSession
      summary: Revoke the current web session
      tags:
        - Authentication
      security:
        - sanctumSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: The current session was revoked.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions:
    get:
      operationId: listWebSessions
      summary: List the authenticated user's web sessions
      tags:
        - Authentication
      security:
        - sanctumSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Project session records belonging to the current user.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSessionCollection"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeAllWebSessions
      summary: Revoke every web session belonging to the current user
      tags:
        - Authentication
      security:
        - sanctumSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: All web sessions were revoked.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/{session_id}:
    delete:
      operationId: revokeWebSession
      summary: Revoke one web session belonging to the current user
      tags:
        - Authentication
      security:
        - sanctumSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: The selected session was revoked.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/revoke:
    post:
      operationId: revokeMobileTokenFamily
      summary: Revoke the active Android token family
      tags:
        - Authentication
      security:
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenRevocation"
      responses:
        "204":
          description: The active mobile token family was revoked.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated identity and available memberships
      tags:
        - Identity
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The authenticated identity and server-selected context.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/organization-context:
    put:
      operationId: selectOrganizationContext
      summary: Select one of the authenticated user's active memberships
      description: |
        The membership identifier selects a candidate membership. The server
        derives organization context only after verifying ownership and active
        status; callers never submit an organization identifier.
      tags:
        - Identity
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationContextSelection"
      responses:
        "200":
          description: The active membership context was selected.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /home:
    get:
      operationId: getLearnerHome
      summary: Get the active learner's deterministic home state
      description: |
        Returns onboarding state and, only when one exists, the active
        enrollment and first mission matching the learner's selected goal
        from that enrollment's exact immutable publication pin. The response
        cannot create or replace a curriculum pin.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Learner onboarding and exact-pinned mission state.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerHome"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/onboarding:
    put:
      operationId: completeLearnerOnboarding
      summary: Confirm adult status and select one learner goal
      description: |
        Completes onboarding once for the authenticated active learner
        membership. The command is actor- and request-fingerprint-bound.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLearnerOnboardingRequest"
      responses:
        "200":
          description: Onboarding is complete and current learner home is returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerHome"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /missions/{mission_id}:
    get:
      operationId: getLearnerMission
      summary: Get one governed mission from an exact publication pin
      description: |
        Resolves the mission only through the authenticated learner's active
        enrollment, completed onboarding and selected goal. The deterministic
        correct option and storage object key are never returned. PR-006
        accepts only an immutable publication containing exactly one mission;
        zero or multiple missions fail closed.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Exact governed mission presentation and check choices.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerMission"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /missions/{mission_id}/offline-bundle:
    get:
      operationId: getLearnerOfflineMissionBundle
      summary: Issue one protected deterministic offline mission bundle
      description: |
        Revalidates the authenticated learner's exact active enrollment and
        immutable publication pin, then returns an allowlisted manifest and a
        purpose-specific signed authorization lease valid for no more than 24
        hours. The response is private and no-store; only the reviewed client
        offline store may persist its protected fields.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Exact offline manifest and signed authorization lease.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineMissionBundle"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /missions/{mission_id}/attempts:
    post:
      operationId: startLearnerMissionAttempt
      summary: Start or resume one deterministic mission attempt
      description: |
        Allocates the server-owned attempt number from the exact immutable
        publication snapshot. If an unfinished attempt already exists for
        this learner, enrollment and mission, it is resumed. Exact command
        replay returns the original in-progress start response even after the
        attempt is finalized; it does not reopen or otherwise mutate the
        authoritative attempt.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/MissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLearnerAttemptRequest"
      responses:
        "200":
          description: An exact replay or existing unfinished attempt was returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerAttempt"
        "201":
          description: A new deterministic attempt was started.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerAttempt"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /attempts/{attempt_id}/responses:
    post:
      operationId: recordLearnerAttemptResponse
      summary: Append one deterministic check response
      description: |
        Records the selected governed option and server-derived correctness.
        An optional local-capture receipt contains metadata only: raw learner
        audio, transcripts, hashes, blob URLs and device details are forbidden.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordLearnerAttemptResponseRequest"
      responses:
        "204":
          description: The immutable response was appended.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /attempts/{attempt_id}/submit:
    post:
      operationId: submitLearnerMissionAttempt
      summary: Finalize one deterministic mission attempt
      description: |
        Atomically submits the latest appended response, derives the
        deterministic result, refreshes first/latest/best evidence, advances
        knowledge mastery when qualified and schedules review. PR-006 never
        awards spoken mastery. Exact command replay reconstructs the original
        result as of this attempt and excludes later attempts; progress reads
        remain current across every submitted attempt.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Authoritative deterministic result and review schedule.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerMissionResult"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /offline-completions:
    post:
      operationId: completeLearnerOfflineMission
      summary: Atomically synchronize one offline deterministic completion
      description: |
        Validates the exact signed bundle lease and current learner authority,
        then starts, responds to and submits one PR-006 attempt in one outer
        transaction. The server derives attempt number, correctness, mastery
        and review state. Exact replay returns the original result; a changed
        replay conflicts. Raw learner audio and caller-authored authority are
        forbidden.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOfflineMissionRequest"
      responses:
        "200":
          description: Authoritative deterministic result for the synchronized completion.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerMissionResult"
        "401":
