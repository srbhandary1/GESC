openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Global English API
  version: 0.48.0
  description: |
    Canonical API contract for the Global English platform. Razorpay sandbox
    checkout adds server-created orders, signed confirmation, authoritative
    captured-payment reconciliation and replay-safe webhooks. UX-07A
    applies the accepted persisted-timezone delayed-review window and replaces
    completion-labelled review-attempt metrics with reviewed/attempted terms.
    SPEECH-RT-01
    adds a consent-gated first-party realtime STT ticket that fail-closes
    to recorded upload. SPEECH-LAT-01
    streams conversation reply audio from a private no-store path instead of
    embedding a WAV in the turn JSON. SPEECH-ADMIN-01
    adds the permission-gated Speech Economics usage, export and
    platform-only commercial endpoints. ADR-0038 adds
    authenticated, content-free, sampled first-audible telemetry with a
    fixed 30-day call-level retention boundary. ADR-0037 adds
    monthly live-AI caps on Direct paid plans and prepaid talk-time packs.
    ADR-0036 adds
    the Premium flagship Direct plan and one complimentary Premium month for
    current Direct learners. ADR-0035 adds
    Direct learner subscriptions, GST-exclusive dummy checkout and operator
    entitlement administration. ADR-0034 adds
    Google and Facebook as extra sign-in methods for already-enrolled users
    that issue the same Sanctum session or Android Passport family.
    ADR-0033 adds
    first-party Android username/password sign-in that issues the existing
    Passport token family without enabling the public password grant.
    APP-0053 permits
    the non-production soft-launch conversation path to process typed or
    learner-confirmed transcripts with Azure OpenAI while reporting an
    explicit text-first/on-device playback fallback. ADR-0016 extends
    the bounded current-organization private Media Library with long-form
    lesson audio while preserving short model-audio and lesson-video
    semantics. ADMIN-MEDIA-01 retains resumable
    app-proxied quarantine upload, exact inspection and scan evidence,
    accessibility metadata review, appointed program rights, immutable
    attachment/replacement and retirement lifecycle. ADMIN-CONTENT-01 keeps
    the bounded current-organization Content Studio, typed graph-v2 and
    governed-text authoring, exact-head review queues, private preview and the
    immediate/scheduled immutable publication lifecycle under signed-in
    role/permission authorization, idempotency and optimistic concurrency.
    ADMIN-LEARNER-01 learner lifecycle,
    ADMIN-ORG-01 staff governance, ADMIN-SHELL-01 safe search/cursors,
    DR-0025 adds a protected private candidate read and atomic human
    reconciliation boundary for one governed LPL-01 transcription campaign.
    AUTH-PASSWORD-01 adds platform-global username/password sign-in, one-time
    invitation enrollment with a self-chosen credential, ordinary recovery
    and an explicit legacy-credential cutover. ADR-0022 replaces role-specific recovery with one role-neutral
    recovery path, immediate verified-contact setup for listed username-less
    accounts and one exact platform account-recovery manager capability.
    ADR-0023 makes the signed-in session plus current organization role and
    permission groups sufficient for routine operator work; current-password
    confirmation is limited to credential, recovery-contact and administrator-
    authority changes.
    PRIV-DSR-01 inventory,
    VIDEO-01 delivery and deterministic authoritative learning remain in
    force. Credentials, invitation digests, identity data, raw audio,
    transcripts, object keys and provider secret payloads remain excluded.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same-origin API
tags:
  - name: Health
    description: Public liveness and dependency-readiness checks.
  - name: Authentication
    description: Same-origin web session and mobile-family lifecycle.
  - name: Identity
    description: Authenticated user and active-membership context.
  - name: Tenancy
    description: Institution membership operations with server-derived scope.
  - name: Learning
    description: |
      Tenant-scoped onboarding, exact-pinned mission delivery, deterministic
      formative attempts, mastery projection and review scheduling.
  - name: Conversation
    description: |
      Tenant-scoped Friend and Role-play practice. Local/testing uses
      deterministic adapters; the allowlisted non-production soft-launch path
      accepts typed or learner-confirmed transcripts for a gated Azure OpenAI
      model and reports text-first/on-device playback while Azure Speech
      ordinary-product DI remains separately gated.
  - name: Voice
    description: |
      Tenant-scoped PR-009 consent, secure PCM/WAV recording, transcript review
      and verifiable deletion. No reviewed live STT/TTS provider is configured.
  - name: Memory
    description: |
      Tenant-scoped learner-visible AI memory facts with explicit create, edit
      and delete. Facts are purpose-bound and never hidden from the learner.
  - name: Operator
    description: |
      Tenant-scoped operator content, privacy, support and audit surfaces.
      Every route is web-session-only and rechecks selected organization,
      role, permission and resource scope. Routine work uses the signed-in
      session without password re-entry. Staff invitations, role-group
      definitions, staff role assignment and staff membership lifecycle are
      administrator-authority changes and additionally require current-
      password confirmation. Passport bearers are denied.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process can respond
      tags:
        - Health
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The API process is live.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required platform dependencies are available
      tags:
        - Health
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: All required platform dependencies are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required platform dependency is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Retry-After:
              description: Suggested minimum delay before another readiness check.
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/Problem"
  /oauth/authorize:
    get:
      operationId: beginMobileAuthorization
      summary: Begin first-party Android authorization
      description: |
        Opens only in the system browser for a registered public Android
        client. State and an S256 PKCE challenge are mandatory. The server
        validates the registered redirect URI and never accepts a client
        secret for this flow.
      tags:
        - Authentication
      servers:
        - url: /
          description: Standards-based Passport authorization endpoint.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 512
        - name: scope
          in: query
          required: true
          schema:
            type: string
            const: "mobile:api"
      responses:
        "200":
          description: Server-controlled sign-in or authorization HTML.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/html:
              schema:
                type: string
        "302":
          description: |
            Redirect to server-controlled sign-in or to the exact registered
            Android callback URI after approval or denial.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/OAuthProblem"
  /oauth/social/{provider}/authorize:
    get:
      operationId: beginFederatedAuthorization
      summary: Begin first-party Google or Facebook authorization
      description: |
        Browser and origin-pinned Android Custom Tabs entry. Guest sign-in
        succeeds only for an already linked IdP subject. Linking uses
        `intent=link` with an authenticated web session or Android link-start.
      tags: [Authentication]
      servers:
        - url: /
          description: First-party federated authorization endpoint.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
        - name: intent
          in: query
          required: false
          schema:
            type: string
            enum: [sign_in, link]
            default: sign_in
        - name: client_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: installation_id
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Ulid"
        - name: link_request
          in: query
          required: false
          schema:
            type: string
            minLength: 20
            maxLength: 128
      responses:
        "200":
          description: Unused. Successful federated authorization always redirects.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to Google or Facebook, or back to sign-in.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /oauth/social/{provider}/callback:
    get:
      operationId: completeFederatedAuthorization
      summary: Complete first-party Google or Facebook authorization
      description: |
        Exchanges the IdP code on the API origin. Web starts the same Sanctum
        session as password sign-in. Android receives a single-use ticket in
        the custom-scheme URL; tokens are never placed in that URL.
      tags: [Authentication]
      servers:
        - url: /
          description: First-party federated callback endpoint.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Unused. Successful federated callback always redirects.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/html:
              schema:
                type: string
        "302":
          description: Redirect to the web app or the Android custom-scheme callback.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "404":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /oauth/token:
    post:
      operationId: exchangeMobileToken
      summary: Exchange or rotate first-party Android credentials
      description: |
        Android-only public-client endpoint. Authorization codes require the
        original PKCE verifier. Refresh credentials are single-use and rotate
        on success. Access tokens expire after 15 minutes; a refresh family
        expires after 30 days of inactivity or 90 days absolute. The
        installation ULID is required for issuance and every refresh. Client
        authentication is prohibited: neither a client_secret parameter nor an
        Authorization header is accepted.
      tags:
        - Authentication
      servers:
        - url: /
          description: Standards-based Passport token endpoint.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MobileAuthorizationCodeExchange"
                - $ref: "#/components/schemas/MobileRefreshTokenExchange"
      responses:
        "200":
          description: A new access token and single-use refresh credential.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              required: true
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "400":
          $ref: "#/components/responses/OAuthProblem"
        "401":
          $ref: "#/components/responses/OAuthProblem"
        "429":
          $ref: "#/components/responses/OAuthProblem"
        default:
          $ref: "#/components/responses/OAuthProblem"
  /auth/mobile/password/sign-ins:
    post:
      operationId: signInWithMobilePassword
      summary: Issue a Passport token family with username and password
      description: |
        Android-only first-party endpoint. Verifies the same username/password
        credential as web sign-in, then issues a Passport access token and
        rotating refresh family for the approved public Android client and
        `mobile:api`. No web session cookie is created. The public
        `/oauth/token` password grant remains rejected.
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobilePasswordSignIn"
      responses:
        "200":
          description: A new access token and single-use refresh credential.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/password/invitation-enrollments:
    post:
      operationId: enrollWithMobilePasswordInvitation
      summary: Create one invited account with a self-chosen username and password
      description: |
        Android in-app invitation enrollment. The invitation is consumed in the
        same transaction that creates the account, password credential, scoped
        membership, optional role and optional enrollment. No session or token
        family is created; the new user signs in normally after setup.
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInvitationEnrollment"
      responses:
        "204":
          description: The invited account and credential were created atomically.
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/password/mode:
    get:
      operationId: getMobileAuthenticationMode
      summary: Get the safe global authentication migration mode for Android
      tags: [Authentication]
      security: []
      responses:
        "200":
          description: The current global authentication mode and approved native OAuth client when available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileAuthenticationModeResponse"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/password/recovery-requests:
    post:
      operationId: requestMobilePasswordRecovery
      summary: Request enumeration-safe ordinary password recovery from Android
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryRequest"
      responses:
        "202":
          description: The request was accepted regardless of account state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericRecoveryResponse"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/social/providers:
    get:
      operationId: getFederatedProviders
      summary: Get whether Google and Facebook sign-in are configured
      tags: [Authentication]
      security: []
      responses:
        "200":
          description: Provider availability for the current deployment.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedProviderAvailability"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/social/providers:
    get:
      operationId: getMobileFederatedProviders
      summary: Get whether Google and Facebook sign-in are configured for Android
      tags: [Authentication]
      security: []
      responses:
        "200":
          description: Provider availability for the current deployment.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedProviderAvailability"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/social/{provider}/authorization:
    get:
      operationId: getMobileFederatedAuthorization
      summary: Get the origin-pinned Custom Tabs URL for Android federated sign-in
      tags: [Authentication]
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: installation_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Ulid"
      responses:
        "200":
          description: First-party authorization URL for Custom Tabs.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileFederatedAuthorizationResponse"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/social/sign-ins:
    post:
      operationId: signInWithMobileFederatedTicket
      summary: Exchange a single-use federated ticket for a Passport family
      description: |
        Android-only. The Custom Tabs callback carries `social_ticket`, not
        tokens. This POST issues the same family as password sign-in with
        grant name `federated_sign_in`. `/oauth/token` still rejects
        `grant_type=password`.
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileFederatedSignIn"
      responses:
        "200":
          description: A new access token and single-use refresh credential.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/social/{provider}/link-starts:
    post:
      operationId: startMobileFederatedLink
      summary: Start Android Google or Facebook linking for the signed-in user
      tags: [Authentication]
      security:
        - passportOAuth:
            - mobile:api
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileFederatedLinkStart"
      responses:
        "200":
          description: First-party authorization URL for Custom Tabs.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileFederatedAuthorizationResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/social/links:
    get:
      operationId: getMobileFederatedLinks
      summary: List linked Google and Facebook accounts for the Android user
      tags: [Authentication]
      security:
        - passportOAuth:
            - mobile:api
      responses:
        "200":
          description: Linked providers for the authenticated user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedProviderAvailability"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/social/{provider}/links:
    delete:
      operationId: unlinkMobileFederatedProvider
      summary: Disconnect Google or Facebook from the Android user
      tags: [Authentication]
      security:
        - passportOAuth:
            - mobile:api
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
      responses:
        "204":
          description: The provider is no longer linked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/social/links:
    get:
      operationId: getFederatedLinks
      summary: List linked Google and Facebook accounts for the web user
      tags: [Authentication]
      security:
        - sanctumSession: []
      responses:
        "200":
          description: Linked providers for the authenticated user.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FederatedProviderAvailability"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/social/{provider}/links:
    delete:
      operationId: unlinkFederatedProvider
      summary: Disconnect Google or Facebook from the web user
      tags: [Authentication]
      security:
        - sanctumSession: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, facebook]
      responses:
        "204":
          description: The provider is no longer linked.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/sign-ins:
    post:
      operationId: signInWithPassword
      summary: Create a web session with username and password
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSignIn"
      responses:
        "200":
          description: A same-origin web session was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/password/invitation-enrollments:
    post:
      operationId: enrollWithPasswordInvitation
      summary: Create one invited account with a self-chosen username and password
      description: |
        Stateful-browser setup only. The invitation is consumed in the same
        transaction that creates the account, password credential, scoped
        membership, optional role and optional enrollment. No session is
        created; the new user signs in normally after setup.
      tags: [Authentication]
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInvitationEnrollment"
      responses:
        "204":
