          maxLength: 64
        notice_sha256:
          $ref: "#/components/schemas/Sha256"
        policy_version:
          type: string
          minLength: 1
          maxLength: 32
        purpose:
          $ref: "#/components/schemas/VoiceConsentPurpose"
        replayed:
