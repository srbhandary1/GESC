components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Optional caller-provided UUID used to correlate one request. Invalid
        values are ignored and replaced with a server-generated UUID.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque UUID or ULID identifying one replayable command.
      schema:
        type: string
        minLength: 26
        maxLength: 36
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$|^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    SessionId:
      name: session_id
      in: path
      required: true
      description: Project-owned public session ULID, never the Laravel session key.
      schema:
        $ref: "#/components/schemas/Ulid"
    ConversationSessionId:
      name: conversation_session_id
      in: path
      required: true
      description: Learner-owned deterministic Friend-session ULID.
      schema:
        $ref: "#/components/schemas/Ulid"
    ConversationTurnId:
      name: conversation_turn_id
      in: path
      required: true
      description: Learner-owned deterministic Friend-turn ULID.
      schema:
        $ref: "#/components/schemas/Ulid"
    VoicePurpose:
      name: voice_purpose
      in: path
      required: true
      description: Separately revocable voice-processing purpose.
      schema:
        $ref: "#/components/schemas/VoiceConsentPurpose"
    VoiceRecordingId:
      name: voice_recording_id
      in: path
      required: true
      description: Learner-owned secure recording ULID.
      schema:
        $ref: "#/components/schemas/Ulid"
    MissionId:
      name: mission_id
      in: path
      required: true
      description: Governed curriculum mission ULID from the exact publication pin.
      schema:
        $ref: "#/components/schemas/Ulid"
    AttemptId:
      name: attempt_id
      in: path
      required: true
      description: Server-assigned learner-attempt ULID.
      schema:
        $ref: "#/components/schemas/Ulid"
    MediaAssetId:
      name: asset_id
      in: path
      required: true
      description: Governed model-audio asset ULID from the exact mission manifest.
      schema:
        $ref: "#/components/schemas/Ulid"
    EnrollmentId:
      name: enrollment_id
      in: query
      required: true
      description: |
        Candidate enrollment ULID. The server accepts it only when it belongs
        to the authenticated active learner membership and has an exact active
        curriculum-publication pin.
      schema:
        $ref: "#/components/schemas/Ulid"
    MissionQueryId:
      name: mission_id
      in: query
      required: true
      description: Mission ULID used to authorize the requested model-audio asset.
      schema:
        $ref: "#/components/schemas/Ulid"
  headers:
    CorrelationId:
      required: true
      description: UUID that correlates the response with privacy-safe logs.
      schema:
        type: string
        format: uuid
    NoStore:
      required: true
      description: |
        Includes the `no-store` cache-control directive so intermediaries do
        not cache operational or identity state. Other defensive directives
        may also be present.
      schema:
        type: string
        pattern: '(^|,\s*)no-store(\s*,|$)'
  responses:
    Problem:
      description: The request could not be completed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    OAuthProblem:
      description: The OAuth request could not be completed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Pragma:
          required: true
          schema:
            type: string
            const: no-cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: __Host-global_english_session
      description: |
        Secure, HttpOnly same-origin session cookie. Browser JavaScript never
        reads or persists this credential.
    passportOAuth:
      type: oauth2
      description: Android Authorization Code flow with S256 PKCE.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            "mobile:api": Access the first-party Android application.
  schemas:
    Ulid:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    SupportedLocale:
      type: string
      enum:
        - en-IN
        - kn-IN
        - ml-IN
        - ta-IN
        - te-IN
        - hi-IN
    OtpRequest:
      type: object
      additionalProperties: false
      required:
        - mobile_number
      properties:
        mobile_number:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
    OtpChallenge:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - expires_at
      properties:
        challenge_id:
          $ref: "#/components/schemas/Ulid"
        expires_at:
          type: string
          format: date-time
    OtpVerification:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - mobile_number
        - code
      properties:
        challenge_id:
          $ref: "#/components/schemas/Ulid"
        mobile_number:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        code:
          type: string
          pattern: "^[0-9]{6}$"
        institution_invite_code:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            Optional single-use institution invite secret. The server never
            stores or logs the raw value.
    UserIdentitySummary:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
    AuthenticatedSessionResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - session
      properties:
        user:
          $ref: "#/components/schemas/UserIdentitySummary"
        session:
          $ref: "#/components/schemas/WebSessionSummary"
    WebSessionCollection:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebSessionSummary"
    WebSessionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - current
        - created_at
        - last_activity_at
        - expires_at
        - privileged
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        current:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        privileged:
          type: boolean
        mfa_verified_at:
          type:
            - string
            - "null"
          format: date-time
    OrganizationSummary:
      type: object
      additionalProperties: false
      required:
        - id
