        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/ConversationSessionId"
        - name: ticket
          in: query
          required: true
          schema:
            type: string
            minLength: 26
            maxLength: 26
      responses:
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          description: Dispatch denied; use recorded upload recovery.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
