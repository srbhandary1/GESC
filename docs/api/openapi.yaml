  /media-assets/{asset_id}/lesson-video:
    get:
      operationId: streamLearnerLessonVideo
      summary: Stream exact governed lesson-video bytes
      description: |
        Authorizes through the learner's exact enrollment and lesson pin,
        verifies the stored bytes against the published size and SHA-256, and
        streams those same verified bytes in fixed-size chunks without a
        full-file response buffer or storage-key disclosure. One satisfiable
        byte range returns 206. A stale or weak If-Range, a malformed range,
        or a multi-range request returns the complete 200 representation;
        syntactically valid ranges outside the object return 416. Separate
        from model-audio streaming (ADR-0013).
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MediaAssetId"
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/LessonQueryId"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfRange"
      responses:
        "200":
          description: The verified lesson-video object.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptByteRanges"
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 20000000
            ETag:
              $ref: "#/components/headers/LessonVideoEntityTag"
            X-Content-SHA256:
              required: true
              description: SHA-256 of the governed lesson-video bytes.
              schema:
                $ref: "#/components/schemas/Sha256"
          content:
            "video/mp4":
              schema:
                type: string
                format: binary
        "206":
          description: One satisfiable range from the verified lesson-video object.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptByteRanges"
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 20000000
            Content-Range:
              $ref: "#/components/headers/SatisfiedContentRange"
            ETag:
              $ref: "#/components/headers/LessonVideoEntityTag"
            X-Content-SHA256:
              required: true
              description: SHA-256 of the complete governed lesson-video object.
              schema:
                $ref: "#/components/schemas/Sha256"
          content:
            "video/mp4":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "416":
          description: The single byte range is outside the verified metadata length.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Accept-Ranges:
              $ref: "#/components/headers/AcceptByteRanges"
            Content-Range:
              $ref: "#/components/headers/UnsatisfiedContentRange"
            ETag:
              $ref: "#/components/headers/LessonVideoEntityTag"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
