          required: true
          schema:
            type: string
            const: no-cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: __Host-global_english_session
      description: |
        Secure, HttpOnly same-origin session cookie. Browser JavaScript never
        reads or persists this credential. Routine operator work relies on the
        signed-in session plus command-time role/permission enforcement.
        Credential, recovery-contact and administrator-authority changes may
        additionally require current-password confirmation no more than five
        minutes old and bound to the current credential version.
    passportOAuth:
      type: oauth2
      description: Android Authorization Code flow with S256 PKCE.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            "mobile:api": Access the first-party Android application.
