components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Optional caller-provided UUID used to correlate one request. Invalid
        values are ignored and replaced with a server-generated UUID.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque UUID or ULID identifying one replayable command.
      schema:
        type: string
        minLength: 26
        maxLength: 36
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$|^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        example: 018f6f12-6a09-7d8a-8f28-a5910041319e
    OperatorPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of tenant-bound rows to return.
      schema:
        type: integer
        minimum: 1
        maximum: 25
        default: 25
    OperatorCursor:
      name: cursor
      in: query
      required: false
      description: Encrypted continuation bound to tenant, purpose and filters.
      schema:
        $ref: "#/components/schemas/OperatorCursor"
    SpeechEconomicsFrom:
      name: from
      in: query
      required: false
      description: Inclusive usage-date lower bound in the active organization timezone calendar day.
      schema:
        type: string
        format: date
    SpeechEconomicsTo:
      name: to
      in: query
      required: false
      description: Inclusive usage-date upper bound. Rejected when earlier than from.
      schema:
        type: string
        format: date
    SpeechEconomicsEnvironment:
      name: environment
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
