        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/MediaLibraryProblemDetails"
    MediaLibraryCommandReplay:
      description: Exact actor, operation, target and request replay returned.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorMediaCommandResult"
    MediaLibraryCommandCreated:
      description: Governed private-media command completed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorMediaCommandResult"
    OperatorMediaPreview:
      description: Hash-verified private audio or complete MP4 object.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Content-Length:
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 20000000
        X-Content-SHA256:
          required: true
          schema:
            $ref: "#/components/schemas/Sha256"
      content:
        "audio/*":
          schema:
            type: string
            format: binary
        video/mp4:
          schema:
            type: string
            format: binary
    ContentWorkspaceCommandReplay:
      description: Exact actor, operation, target and body replay returned.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OperatorContentWorkspaceCommandResult"
    ContentWorkspaceCommandCreated:
