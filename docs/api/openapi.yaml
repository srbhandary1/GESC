            $ref: "#/components/schemas/LearnerAiMemoryFactListingItem"
    LearnerAiMemoryFactListingItem:
      type: object
      additionalProperties: false
      required:
        - id
        - purpose
        - source
        - status
        - fact_text
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        purpose:
          type: string
          const: conversation_context
        source:
          type: string
          const: learner_explicit
        status:
          type: string
          const: active
        fact_text:
          type: string
          minLength: 1
          maxLength: 200
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PriorityCorrection:
      type: object
      additionalProperties: false
      description: |
        One logically separate priority correction. Never merged into the
        Friend conversational reply text. explanation_l1 is the active UI
        locale explanation. explanation_kn is a deprecated dual-write alias
        present only when explanation_locale is kn-IN.
      required:
        - needed
        - error_category
        - correction_en
        - explanation_l1
        - explanation_locale
        - retry_recommended
      properties:
        needed:
          type: boolean
        error_category:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z0-9][a-z0-9._-]{0,63}$"
        correction_en:
          type: string
          minLength: 1
          maxLength: 500
        explanation_l1:
          type: string
          minLength: 1
          maxLength: 500
        explanation_locale:
          $ref: "#/components/schemas/SupportedLocale"
        explanation_kn:
          type: string
          minLength: 1
          maxLength: 500
          deprecated: true
          description: Deprecated dual-write alias when explanation_locale is kn-IN.
        learner_span:
          type: string
          minLength: 1
          maxLength: 200
        encouragement_l1:
          type: string
          minLength: 1
          maxLength: 500
        retry_recommended:
          type: boolean
    ConversationTurn:
      type: object
      additionalProperties: false
      required:
        - id
        - conversation_session_id
        - turn_number
        - status
        - transcript
        - understood_intent
        - assistant_reply
        - priority_correction
        - safety_state
        - speech
        - usage
        - events_url
        - replayed
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        conversation_session_id:
          $ref: "#/components/schemas/Ulid"
        turn_number:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - completed
            - failed
        transcript:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 500
        understood_intent:
          type:
            - string
            - "null"
          maxLength: 100
        assistant_reply:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 1000
        priority_correction:
          oneOf:
            - $ref: "#/components/schemas/PriorityCorrection"
            - type: "null"
        safety_state:
          oneOf:
            - type: string
              enum:
                - ok
                - fallback
            - type: "null"
        speech:
          oneOf:
            - $ref: "#/components/schemas/ConversationSpeechResult"
            - type: "null"
        usage:
          $ref: "#/components/schemas/ConversationUsageSummary"
        events_url:
          type: string
          pattern: "^/api/v1/conversation-turns/[0-9A-HJKMNP-TV-Z]{26}/events$"
        replayed:
          type: boolean
    ConversationTurnEvent:
      type: object
      description: |
        The JSON payload of each `conversation-status` SSE frame. The
        transport may emit a bounded ordered sequence of these payloads.
      additionalProperties: false
      required:
        - sequence
        - state
        - event_code
        - provider_stage
        - provider_attempt
        - recorded_at
      properties:
        sequence:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
            - accepted
            - transcribing
            - generating_reply
            - synthesizing
            - completed
            - failed
        event_code:
          type: string
          enum:
            - turn.accepted
            - turn.transcribing
            - turn.generating_reply
            - turn.synthesizing
            - turn.provider_retrying
            - turn.completed
            - turn.failed
        provider_stage:
          type:
            - string
            - "null"
          enum:
            - stt
            - model
            - tts
            - null
        provider_attempt:
          type:
            - integer
            - "null"
          minimum: 1
        recorded_at:
          type: string
          format: date-time
