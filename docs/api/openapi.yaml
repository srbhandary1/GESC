openapi: 3.1.1
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Global English API
  version: 0.5.0
  description: |
    Canonical API contract for the Global English platform. PR-007 adds an
    exact-pinned offline mission bundle and one atomic idempotent reconnect
    command over the deterministic PR-006 learner slice. Learner recording
    bytes remain local and volatile; the API accepts only a bounded,
    non-authoritative local-capture receipt that cannot award spoken mastery.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
    description: Same-origin API
tags:
  - name: Health
    description: Public liveness and dependency-readiness checks.
  - name: Authentication
    description: Same-origin web session and mobile-family lifecycle.
  - name: Identity
    description: Authenticated user and active-membership context.
  - name: Tenancy
    description: Institution membership operations with server-derived scope.
  - name: Learning
    description: |
      Tenant-scoped onboarding, exact-pinned mission delivery, deterministic
      formative attempts, mastery projection and review scheduling.
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API process can respond
      tags:
        - Health
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The API process is live.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        default:
          $ref: "#/components/responses/Problem"
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether required platform dependencies are available
      tags:
        - Health
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: All required platform dependencies are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: At least one required platform dependency is unavailable.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Retry-After:
              description: Suggested minimum delay before another readiness check.
              schema:
                type: integer
                minimum: 1
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        default:
          $ref: "#/components/responses/Problem"
  /oauth/authorize:
    get:
      operationId: beginMobileAuthorization
      summary: Begin first-party Android authorization
      description: |
        Opens only in the system browser for a registered public Android
        client. State and an S256 PKCE challenge are mandatory. The server
        validates the registered redirect URI and never accepts a client
        secret for this flow.
      tags:
        - Authentication
      servers:
        - url: /
          description: Standards-based Passport authorization endpoint.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            minLength: 43
            maxLength: 128
            pattern: "^[A-Za-z0-9_-]+$"
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 32
            maxLength: 512
        - name: scope
          in: query
          required: true
          schema:
            type: string
            const: "mobile:api"
      responses:
        "200":
          description: Server-controlled sign-in or authorization HTML.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            text/html:
              schema:
                type: string
        "302":
          description: |
            Redirect to server-controlled sign-in or to the exact registered
            Android callback URI after approval or denial.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/OAuthProblem"
  /oauth/token:
    post:
      operationId: exchangeMobileToken
      summary: Exchange or rotate first-party Android credentials
      description: |
        Android-only public-client endpoint. Authorization codes require the
        original PKCE verifier. Refresh credentials are single-use and rotate
        on success. Access tokens expire after 15 minutes; a refresh family
        expires after 30 days of inactivity or 90 days absolute. The
        installation ULID is required for issuance and every refresh. Client
        authentication is prohibited: neither a client_secret parameter nor an
        Authorization header is accepted.
      tags:
        - Authentication
      servers:
        - url: /
          description: Standards-based Passport token endpoint.
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/MobileAuthorizationCodeExchange"
                - $ref: "#/components/schemas/MobileRefreshTokenExchange"
      responses:
        "200":
          description: A new access token and single-use refresh credential.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              required: true
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenResponse"
        "400":
          $ref: "#/components/responses/OAuthProblem"
        "401":
          $ref: "#/components/responses/OAuthProblem"
        "429":
          $ref: "#/components/responses/OAuthProblem"
        default:
          $ref: "#/components/responses/OAuthProblem"
  /auth/otp/requests:
    post:
      operationId: requestOtp
      summary: Request a short-lived local OTP challenge
      description: |
        Always returns the same accepted shape so callers cannot determine
        whether the normalized mobile number already belongs to an identity.
        PR-003 uses only the fake/local OTP adapter.
      tags:
        - Authentication
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "202":
          description: The challenge request was accepted.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/otp/verifications:
    post:
      operationId: verifyOtp
      summary: Verify an OTP and create a web session
      description: |
        Consumes the challenge once and establishes a same-origin Sanctum
        cookie session. When institution_invite_code is omitted, the verified
        identity is assigned to Global English Direct. When it is present, the
        verified identity accepts that institution invite transactionally and
        receives no automatic Direct membership. Invite availability is not
        disclosed by the public error response. The response never contains
        the cookie credential.
      tags:
        - Authentication
      security: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerification"
      responses:
        "200":
          description: The challenge was verified and a web session was created.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedSessionResponse"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logoutWebSession
      summary: Revoke the current web session
      tags:
        - Authentication
      security:
        - sanctumSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: The current session was revoked.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions:
    get:
      operationId: listWebSessions
      summary: List the authenticated user's web sessions
      tags:
        - Authentication
      security:
        - sanctumSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Project session records belonging to the current user.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSessionCollection"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: revokeAllWebSessions
      summary: Revoke every web session belonging to the current user
      tags:
        - Authentication
      security:
        - sanctumSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          description: All web sessions were revoked.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/sessions/{session_id}:
    delete:
      operationId: revokeWebSession
      summary: Revoke one web session belonging to the current user
      tags:
        - Authentication
      security:
        - sanctumSession: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: The selected session was revoked.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/mobile/revoke:
    post:
      operationId: revokeMobileTokenFamily
      summary: Revoke the active Android token family
      tags:
        - Authentication
      security:
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenRevocation"
      responses:
        "204":
          description: The active mobile token family was revoked.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated identity and available memberships
      tags:
        - Identity
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: The authenticated identity and server-selected context.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/organization-context:
    put:
      operationId: selectOrganizationContext
      summary: Select one of the authenticated user's active memberships
      description: |
        The membership identifier selects a candidate membership. The server
        derives organization context only after verifying ownership and active
        status; callers never submit an organization identifier.
      tags:
        - Identity
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationContextSelection"
      responses:
        "200":
          description: The active membership context was selected.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /home:
    get:
      operationId: getLearnerHome
      summary: Get the active learner's deterministic home state
      description: |
        Returns onboarding state and, only when one exists, the active
        enrollment and first mission matching the learner's selected goal
        from that enrollment's exact immutable publication pin. The response
        cannot create or replace a curriculum pin.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Learner onboarding and exact-pinned mission state.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerHome"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /me/onboarding:
    put:
      operationId: completeLearnerOnboarding
      summary: Confirm adult status and select one learner goal
      description: |
        Completes onboarding once for the authenticated active learner
        membership. The command is actor- and request-fingerprint-bound.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteLearnerOnboardingRequest"
      responses:
        "200":
          description: Onboarding is complete and current learner home is returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerHome"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /missions/{mission_id}:
    get:
      operationId: getLearnerMission
      summary: Get one governed mission from an exact publication pin
      description: |
        Resolves the mission only through the authenticated learner's active
        enrollment, completed onboarding and selected goal. The deterministic
        correct option and storage object key are never returned. PR-006
        accepts only an immutable publication containing exactly one mission;
        zero or multiple missions fail closed.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Exact governed mission presentation and check choices.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerMission"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /missions/{mission_id}/offline-bundle:
    get:
      operationId: getLearnerOfflineMissionBundle
      summary: Issue one protected deterministic offline mission bundle
      description: |
        Revalidates the authenticated learner's exact active enrollment and
        immutable publication pin, then returns an allowlisted manifest and a
        purpose-specific signed authorization lease valid for no more than 24
        hours. The response is private and no-store; only the reviewed client
        offline store may persist its protected fields.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MissionId"
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Exact offline manifest and signed authorization lease.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfflineMissionBundle"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /missions/{mission_id}/attempts:
    post:
      operationId: startLearnerMissionAttempt
      summary: Start or resume one deterministic mission attempt
      description: |
        Allocates the server-owned attempt number from the exact immutable
        publication snapshot. If an unfinished attempt already exists for
        this learner, enrollment and mission, it is resumed. Exact command
        replay returns the original in-progress start response even after the
        attempt is finalized; it does not reopen or otherwise mutate the
        authoritative attempt.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/MissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartLearnerAttemptRequest"
      responses:
        "200":
          description: An exact replay or existing unfinished attempt was returned.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerAttempt"
        "201":
          description: A new deterministic attempt was started.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerAttempt"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /attempts/{attempt_id}/responses:
    post:
      operationId: recordLearnerAttemptResponse
      summary: Append one deterministic check response
      description: |
        Records the selected governed option and server-derived correctness.
        An optional local-capture receipt contains metadata only: raw learner
        audio, transcripts, hashes, blob URLs and device details are forbidden.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AttemptId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordLearnerAttemptResponseRequest"
      responses:
        "204":
          description: The immutable response was appended.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /attempts/{attempt_id}/submit:
    post:
      operationId: submitLearnerMissionAttempt
      summary: Finalize one deterministic mission attempt
      description: |
        Atomically submits the latest appended response, derives the
        deterministic result, refreshes first/latest/best evidence, advances
        knowledge mastery when qualified and schedules review. PR-006 never
        awards spoken mastery. Exact command replay reconstructs the original
        result as of this attempt and excludes later attempts; progress reads
        remain current across every submitted attempt.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AttemptId"
      responses:
        "200":
          description: Authoritative deterministic result and review schedule.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerMissionResult"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /offline-completions:
    post:
      operationId: completeLearnerOfflineMission
      summary: Atomically synchronize one offline deterministic completion
      description: |
        Validates the exact signed bundle lease and current learner authority,
        then starts, responds to and submits one PR-006 attempt in one outer
        transaction. The server derives attempt number, correctness, mastery
        and review state. Exact replay returns the original result; a changed
        replay conflicts. Raw learner audio and caller-authored authority are
        forbidden.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOfflineMissionRequest"
      responses:
        "200":
          description: Authoritative deterministic result for the synchronized completion.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerMissionResult"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /progress:
    get:
      operationId: getLearnerProgress
      summary: Get deterministic progress for one exact-pinned enrollment
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/EnrollmentId"
      responses:
        "200":
          description: Derived mastery, evidence and current review state.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearnerProgress"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /media-assets/{asset_id}/content:
    get:
      operationId: streamLearnerModelAudio
      summary: Stream exact governed model-audio bytes
      description: |
        Authorizes through the learner's exact enrollment and mission pin,
        verifies the stored bytes against the published size and SHA-256, and
        streams those same verified bytes without exposing the storage key.
      tags:
        - Learning
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MediaAssetId"
        - $ref: "#/components/parameters/EnrollmentId"
        - $ref: "#/components/parameters/MissionQueryId"
      responses:
        "200":
          description: The verified model-audio object.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Content-Length:
              required: true
              schema:
                type: integer
                minimum: 1
                maximum: 10000000
            X-Content-SHA256:
              required: true
              description: SHA-256 of the governed model-audio bytes.
              schema:
                $ref: "#/components/schemas/Sha256"
          content:
            "audio/*":
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /institution-invites/accept:
    post:
      operationId: acceptInstitutionInvite
      summary: Accept an institution invite for the authenticated identity
      description: |
        The single-use invite is resolved server-side. Its organization is
        never accepted separately from the caller.
      tags:
        - Tenancy
      security:
        - sanctumSession: []
        - passportOAuth:
            - mobile:api
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstitutionInviteAcceptance"
      responses:
        "200":
          description: The invite had already been accepted by this identity.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAcceptanceResponse"
        "201":
          description: Institution membership was created.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteAcceptanceResponse"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: |
        Optional caller-provided UUID used to correlate one request. Invalid
        values are ignored and replaced with a server-generated UUID.
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Opaque UUID or ULID identifying one replayable command.
      schema:
        type: string
        minLength: 26
        maxLength: 36
        pattern: "^[0-9A-HJKMNP-TV-Z]{26}$|^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    SessionId:
      name: session_id
      in: path
      required: true
      description: Project-owned public session ULID, never the Laravel session key.
      schema:
        $ref: "#/components/schemas/Ulid"
    MissionId:
      name: mission_id
      in: path
      required: true
      description: Governed curriculum mission ULID from the exact publication pin.
      schema:
        $ref: "#/components/schemas/Ulid"
    AttemptId:
      name: attempt_id
      in: path
      required: true
      description: Server-assigned learner-attempt ULID.
      schema:
        $ref: "#/components/schemas/Ulid"
    MediaAssetId:
      name: asset_id
      in: path
      required: true
      description: Governed model-audio asset ULID from the exact mission manifest.
      schema:
        $ref: "#/components/schemas/Ulid"
    EnrollmentId:
      name: enrollment_id
      in: query
      required: true
      description: |
        Candidate enrollment ULID. The server accepts it only when it belongs
        to the authenticated active learner membership and has an exact active
        curriculum-publication pin.
      schema:
        $ref: "#/components/schemas/Ulid"
    MissionQueryId:
      name: mission_id
      in: query
      required: true
      description: Mission ULID used to authorize the requested model-audio asset.
      schema:
        $ref: "#/components/schemas/Ulid"
  headers:
    CorrelationId:
      required: true
      description: UUID that correlates the response with privacy-safe logs.
      schema:
        type: string
        format: uuid
    NoStore:
      required: true
      description: |
        Includes the `no-store` cache-control directive so intermediaries do
        not cache operational or identity state. Other defensive directives
        may also be present.
      schema:
        type: string
        pattern: '(^|,\s*)no-store(\s*,|$)'
  responses:
    Problem:
      description: The request could not be completed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    OAuthProblem:
      description: The OAuth request could not be completed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Pragma:
          required: true
          schema:
            type: string
            const: no-cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthError"
  securitySchemes:
    sanctumSession:
      type: apiKey
      in: cookie
      name: __Host-global_english_session
      description: |
        Secure, HttpOnly same-origin session cookie. Browser JavaScript never
        reads or persists this credential.
    passportOAuth:
      type: oauth2
      description: Android Authorization Code flow with S256 PKCE.
      flows:
        authorizationCode:
          authorizationUrl: /oauth/authorize
          tokenUrl: /oauth/token
          scopes:
            "mobile:api": Access the first-party Android application.
  schemas:
    Ulid:
      type: string
      minLength: 26
      maxLength: 26
      pattern: "^[0-9A-HJKMNP-TV-Z]{26}$"
    OtpRequest:
      type: object
      additionalProperties: false
      required:
        - mobile_number
      properties:
        mobile_number:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
    OtpChallenge:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - expires_at
      properties:
        challenge_id:
          $ref: "#/components/schemas/Ulid"
        expires_at:
          type: string
          format: date-time
    OtpVerification:
      type: object
      additionalProperties: false
      required:
        - challenge_id
        - mobile_number
        - code
      properties:
        challenge_id:
          $ref: "#/components/schemas/Ulid"
        mobile_number:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
        code:
          type: string
          pattern: "^[0-9]{6}$"
        institution_invite_code:
          type: string
          minLength: 12
          maxLength: 128
          description: |
            Optional single-use institution invite secret. The server never
            stores or logs the raw value.
    UserIdentitySummary:
      type: object
      additionalProperties: false
      required:
        - id
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
    AuthenticatedSessionResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - session
      properties:
        user:
          $ref: "#/components/schemas/UserIdentitySummary"
        session:
          $ref: "#/components/schemas/WebSessionSummary"
    WebSessionCollection:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/WebSessionSummary"
    WebSessionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - current
        - created_at
        - last_activity_at
        - expires_at
        - privileged
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        current:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_activity_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        privileged:
          type: boolean
        mfa_verified_at:
          type:
            - string
            - "null"
          format: date-time
    OrganizationSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - kind
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        name:
          type: string
          minLength: 1
          maxLength: 160
        kind:
          type: string
          enum:
            - platform_direct
            - institution
    MembershipSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - organization
        - status
        - membership_type
        - role_keys
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        organization:
          $ref: "#/components/schemas/OrganizationSummary"
        status:
          type: string
          enum:
            - active
            - suspended
            - ended
        membership_type:
          type: string
          enum:
            - learner
            - trainer
            - organization_admin
        role_keys:
          type: array
          uniqueItems: true
          items:
            type: string
            pattern: "^[a-z][a-z0-9._-]*$"
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required:
        - user
        - current_membership
        - memberships
      properties:
        user:
          $ref: "#/components/schemas/UserIdentitySummary"
        current_membership:
          oneOf:
            - $ref: "#/components/schemas/MembershipSummary"
            - type: "null"
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/MembershipSummary"
    OrganizationContextSelection:
      type: object
      additionalProperties: false
      required:
        - membership_id
      properties:
        membership_id:
          $ref: "#/components/schemas/Ulid"
    MobileTokenRevocation:
      type: object
      additionalProperties: false
      required:
        - installation_id
      properties:
        installation_id:
          $ref: "#/components/schemas/Ulid"
    MobileAuthorizationCodeExchange:
      type: object
      additionalProperties: false
      required:
        - grant_type
        - client_id
        - redirect_uri
        - code
        - code_verifier
        - installation_id
      properties:
        grant_type:
          type: string
          const: authorization_code
        client_id:
          type: string
          format: uuid
        redirect_uri:
          type: string
          format: uri
        code:
          type: string
          minLength: 1
          maxLength: 4096
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
        installation_id:
          $ref: "#/components/schemas/Ulid"
    MobileRefreshTokenExchange:
      type: object
      additionalProperties: false
      required:
        - grant_type
        - client_id
        - refresh_token
        - installation_id
      properties:
        grant_type:
          type: string
          const: refresh_token
        client_id:
          type: string
          format: uuid
        refresh_token:
          type: string
          minLength: 1
          maxLength: 4096
        installation_id:
          $ref: "#/components/schemas/Ulid"
    MobileTokenResponse:
      type: object
      additionalProperties: false
      required:
        - token_type
        - expires_in
        - access_token
        - refresh_token
      properties:
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          const: 900
        access_token:
          type: string
          minLength: 1
        refresh_token:
          type: string
          minLength: 1
    OAuthError:
      type: object
      additionalProperties: true
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_client
            - invalid_grant
            - unauthorized_client
            - unsupported_grant_type
            - invalid_scope
            - server_error
        error_description:
          type: string
    InstitutionInviteAcceptance:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          minLength: 12
          maxLength: 128
    EnrollmentSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        status:
          type: string
          enum:
            - pending_curriculum
            - active
            - completed
            - withdrawn
    InviteAcceptanceResponse:
      type: object
      additionalProperties: false
      required:
        - membership
        - enrollment
        - replayed
      properties:
        membership:
          $ref: "#/components/schemas/MembershipSummary"
        enrollment:
          oneOf:
            - $ref: "#/components/schemas/EnrollmentSummary"
            - type: "null"
        replayed:
          type: boolean
    Sha256:
      type: string
      minLength: 64
      maxLength: 64
      pattern: "^[0-9a-f]{64}$"
    LearnerGoal:
      type: string
      enum:
        - everyday-conversation
        - workplace-confidence
        - travel-confidence
    GovernedContent:
      type: object
      additionalProperties: false
      required:
        - locale
        - text
        - revision_id
        - content_hash
      properties:
        locale:
          type: string
          enum:
            - en-IN
            - kn-IN
        text:
          type: string
          minLength: 1
        revision_id:
          $ref: "#/components/schemas/Ulid"
        content_hash:
          $ref: "#/components/schemas/Sha256"
    LearnerOnboardingState:
      type: object
      additionalProperties: false
      required:
        - completed
        - adult_confirmed
        - goal_key
      properties:
        completed:
          type: boolean
        adult_confirmed:
          type: boolean
        goal_key:
          oneOf:
            - $ref: "#/components/schemas/LearnerGoal"
            - type: "null"
    ActiveLearnerEnrollment:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        status:
          type: string
          const: active
    LearnerMissionSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - estimated_minutes
        - title
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        estimated_minutes:
          type: integer
          minimum: 1
          maximum: 60
        title:
          $ref: "#/components/schemas/GovernedContent"
    LearnerHome:
      type: object
      additionalProperties: false
      required:
        - onboarding
        - enrollment
        - next_mission
      properties:
        onboarding:
          $ref: "#/components/schemas/LearnerOnboardingState"
        enrollment:
          oneOf:
            - $ref: "#/components/schemas/ActiveLearnerEnrollment"
            - type: "null"
        next_mission:
          oneOf:
            - $ref: "#/components/schemas/LearnerMissionSummary"
            - type: "null"
    CompleteLearnerOnboardingRequest:
      type: object
      additionalProperties: false
      required:
        - adult_confirmed
        - goal_key
      properties:
        adult_confirmed:
          type: boolean
          const: true
        goal_key:
          $ref: "#/components/schemas/LearnerGoal"
    LearnerModelAudio:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - stream_url
        - mime_type
        - duration_ms
      properties:
        asset_id:
          $ref: "#/components/schemas/Ulid"
        stream_url:
          type: string
          format: uri-reference
        mime_type:
          type: string
          enum:
            - audio/mpeg
            - audio/ogg
            - audio/webm
            - audio/mp4
            - audio/wav
        duration_ms:
          type: integer
          minimum: 250
          maximum: 300000
    LearnerMissionCheckOption:
      type: object
      additionalProperties: false
      required:
        - id
        - label
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
        label:
          $ref: "#/components/schemas/GovernedContent"
    LearnerMissionCheck:
      type: object
      additionalProperties: false
      required:
        - id
        - prompt
        - options
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
        prompt:
          $ref: "#/components/schemas/GovernedContent"
        options:
          type: array
          minItems: 2
          maxItems: 8
          uniqueItems: true
          items:
            $ref: "#/components/schemas/LearnerMissionCheckOption"
    LearnerMission:
      type: object
      additionalProperties: false
      required:
        - id
        - enrollment_id
        - publication_id
        - objective_id
        - title
        - kannada_guidance
        - model_text
        - transcript
        - model_audio
        - check
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        enrollment_id:
          $ref: "#/components/schemas/Ulid"
        publication_id:
          $ref: "#/components/schemas/Ulid"
        objective_id:
          $ref: "#/components/schemas/Ulid"
        title:
          $ref: "#/components/schemas/GovernedContent"
        kannada_guidance:
          $ref: "#/components/schemas/GovernedContent"
        model_text:
          $ref: "#/components/schemas/GovernedContent"
        transcript:
          $ref: "#/components/schemas/GovernedContent"
        model_audio:
          $ref: "#/components/schemas/LearnerModelAudio"
        check:
          $ref: "#/components/schemas/LearnerMissionCheck"
    OfflineModelAudio:
      type: object
      additionalProperties: false
      required:
        - asset_id
        - stream_url
        - mime_type
        - duration_ms
        - content_hash
        - byte_size
      properties:
        asset_id:
          $ref: "#/components/schemas/Ulid"
        stream_url:
          type: string
          format: uri-reference
        mime_type:
          type: string
          enum:
            - audio/mpeg
            - audio/ogg
            - audio/webm
            - audio/mp4
            - audio/wav
        duration_ms:
          type: integer
          minimum: 250
          maximum: 300000
        content_hash:
          $ref: "#/components/schemas/Sha256"
        byte_size:
          type: integer
          minimum: 1
          maximum: 10000000
    OfflineMissionCheckAuthority:
      type: object
      additionalProperties: false
      required:
        - correct_option_id
      properties:
        correct_option_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
    OfflineLearnerMission:
      type: object
      additionalProperties: false
      required:
        - id
        - enrollment_id
        - publication_id
        - objective_id
        - title
        - kannada_guidance
        - model_text
        - transcript
        - model_audio
        - check
        - offline_check
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        enrollment_id:
          $ref: "#/components/schemas/Ulid"
        publication_id:
          $ref: "#/components/schemas/Ulid"
        objective_id:
          $ref: "#/components/schemas/Ulid"
        title:
          $ref: "#/components/schemas/GovernedContent"
        kannada_guidance:
          $ref: "#/components/schemas/GovernedContent"
        model_text:
          $ref: "#/components/schemas/GovernedContent"
        transcript:
          $ref: "#/components/schemas/GovernedContent"
        model_audio:
          $ref: "#/components/schemas/OfflineModelAudio"
        check:
          $ref: "#/components/schemas/LearnerMissionCheck"
        offline_check:
          $ref: "#/components/schemas/OfflineMissionCheckAuthority"
    OfflineBundleBinding:
      type: object
      additionalProperties: false
      required:
        - user_id
        - organization_id
        - membership_id
        - enrollment_id
      properties:
        user_id:
          $ref: "#/components/schemas/Ulid"
        organization_id:
          $ref: "#/components/schemas/Ulid"
        membership_id:
          $ref: "#/components/schemas/Ulid"
        enrollment_id:
          $ref: "#/components/schemas/Ulid"
    OfflineBundlePublication:
      type: object
      additionalProperties: false
      required:
        - owner_organization_id
        - curriculum_version_id
        - publication_id
        - manifest_hash
        - mission_definition_hash
      properties:
        owner_organization_id:
          $ref: "#/components/schemas/Ulid"
        curriculum_version_id:
          $ref: "#/components/schemas/Ulid"
        publication_id:
          $ref: "#/components/schemas/Ulid"
        manifest_hash:
          $ref: "#/components/schemas/Sha256"
        mission_definition_hash:
          $ref: "#/components/schemas/Sha256"
    OfflineMissionManifest:
      type: object
      additionalProperties: false
      required:
        - schema
        - bundle_id
        - issued_at
        - expires_at
        - binding
        - publication
        - policy_version
        - mission
        - bundle_hash
      properties:
        schema:
          type: string
          const: global-english.offline-mission-bundle.v1
        bundle_id:
          $ref: "#/components/schemas/Ulid"
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        binding:
          $ref: "#/components/schemas/OfflineBundleBinding"
        publication:
          $ref: "#/components/schemas/OfflineBundlePublication"
        policy_version:
          type: string
          const: daily-speaking-v1
        mission:
          $ref: "#/components/schemas/OfflineLearnerMission"
        bundle_hash:
          $ref: "#/components/schemas/Sha256"
    OfflineMissionBundle:
      type: object
      additionalProperties: false
      required:
        - manifest
        - lease
      properties:
        manifest:
          $ref: "#/components/schemas/OfflineMissionManifest"
        lease:
          type: string
          minLength: 1
          maxLength: 8192
          description: Purpose-specific signed lease; it is not an API credential.
    CompleteOfflineMissionRequest:
      type: object
      additionalProperties: false
      required:
        - schema
        - bundle_id
        - lease
        - client_attempt_id
        - check_id
        - selected_option_id
        - local_recording
      properties:
        schema:
          type: string
          const: global-english.offline-completion.v1
        bundle_id:
          $ref: "#/components/schemas/Ulid"
        lease:
          type: string
          minLength: 1
          maxLength: 8192
        client_attempt_id:
          type: string
          format: uuid
        check_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
        selected_option_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
        local_recording:
          oneOf:
            - $ref: "#/components/schemas/LocalCaptureReceipt"
            - type: "null"
    StartLearnerAttemptRequest:
      type: object
      additionalProperties: false
      required:
        - enrollment_id
      properties:
        enrollment_id:
          $ref: "#/components/schemas/Ulid"
    LearnerAttempt:
      type: object
      additionalProperties: false
      required:
        - id
        - status
      properties:
        id:
          $ref: "#/components/schemas/Ulid"
        status:
          type: string
          const: in_progress
    LocalCaptureReceipt:
      type: object
      additionalProperties: false
      description: |
        Non-authoritative client metadata for local practice. It contains no
        learner-audio bytes or digest and cannot satisfy spoken mastery.
      required:
        - captured
        - client_capture_id
        - mime_type
        - byte_size
        - duration_ms
      properties:
        captured:
          type: boolean
          const: true
        client_capture_id:
          type: string
          format: uuid
        mime_type:
          type: string
          enum:
            - audio/webm
            - audio/webm;codecs=opus
            - audio/ogg
            - audio/ogg;codecs=opus
            - audio/mp4
        byte_size:
          type: integer
          minimum: 128
          maximum: 10000000
        duration_ms:
          type: integer
          minimum: 250
          maximum: 120000
    RecordLearnerAttemptResponseRequest:
      type: object
      additionalProperties: false
      required:
        - check_id
        - selected_option_id
        - local_recording
      properties:
        check_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
        selected_option_id:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9][a-z0-9._-]{0,99}$"
        local_recording:
          oneOf:
            - $ref: "#/components/schemas/LocalCaptureReceipt"
            - type: "null"
    KnowledgeState:
      type: string
      enum:
        - developing
        - mastered
    SpokenState:
      type: string
      const: unassessed
      description: |
        PR-006 has no eligible spoken evidence, so a local-capture receipt
        never changes this authoritative state.
    LearnerAttemptEvidence:
      type: object
      additionalProperties: false
      required:
        - first_attempt_id
        - first_attempt_number
        - latest_attempt_id
        - latest_attempt_number
        - best_attempt_id
        - best_attempt_number
      properties:
        first_attempt_id:
          $ref: "#/components/schemas/Ulid"
        first_attempt_number:
          type: integer
          minimum: 1
        latest_attempt_id:
          $ref: "#/components/schemas/Ulid"
        latest_attempt_number:
          type: integer
          minimum: 1
        best_attempt_id:
          $ref: "#/components/schemas/Ulid"
        best_attempt_number:
          type: integer
          minimum: 1
    LearnerReviewSchedule:
      type: object
      additionalProperties: false
      required:
        - due_at
        - timezone
      properties:
        due_at:
          type: string
          format: date-time
        timezone:
          type: string
          minLength: 1
          maxLength: 64
    LearnerMissionResult:
      type: object
      additionalProperties: false
      required:
        - attempt_id
        - check_state
        - knowledge_state
        - spoken_state
        - local_capture_receipt_present
        - can_do
        - evidence
        - review
      properties:
        attempt_id:
          $ref: "#/components/schemas/Ulid"
        check_state:
          type: string
          enum:
            - correct
            - incorrect
        knowledge_state:
          $ref: "#/components/schemas/KnowledgeState"
        spoken_state:
          $ref: "#/components/schemas/SpokenState"
        local_capture_receipt_present:
          type: boolean
          description: Engagement receipt only; never authoritative spoken evidence.
        can_do:
          $ref: "#/components/schemas/GovernedContent"
        evidence:
          $ref: "#/components/schemas/LearnerAttemptEvidence"
        review:
          $ref: "#/components/schemas/LearnerReviewSchedule"
    LearnerProgressObjective:
      type: object
      additionalProperties: false
      required:
        - objective_id
        - label
        - knowledge_state
        - spoken_state
        - local_capture_receipt_present
        - evidence
        - review_due_at
        - review_timezone
      properties:
        objective_id:
          $ref: "#/components/schemas/Ulid"
        label:
          $ref: "#/components/schemas/GovernedContent"
        knowledge_state:
          $ref: "#/components/schemas/KnowledgeState"
        spoken_state:
          $ref: "#/components/schemas/SpokenState"
        local_capture_receipt_present:
          type: boolean
          description: Engagement receipt only; never authoritative spoken evidence.
        evidence:
          $ref: "#/components/schemas/LearnerAttemptEvidence"
        review_due_at:
          type: string
          format: date-time
        review_timezone:
          type: string
          minLength: 1
          maxLength: 64
    LearnerProgress:
      type: object
      additionalProperties: false
      required:
        - enrollment_id
        - objectives
      properties:
        enrollment_id:
          $ref: "#/components/schemas/Ulid"
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/LearnerProgressObjective"
    LivenessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - checked_at
        - correlation_id
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: global-english-api
        checked_at:
          type: string
          format: date-time
        correlation_id:
          type: string
          format: uuid
    ReadinessResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - checked_at
        - correlation_id
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
          const: global-english-api
        checked_at:
          type: string
          format: date-time
        correlation_id:
          type: string
          format: uuid
    ProblemDetails:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - detail
        - instance
        - message_key
        - correlation_id
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        message_key:
          type: string
          pattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)*$"
        correlation_id:
          type: string
          format: uuid
