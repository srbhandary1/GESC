      schema:
        $ref: "#/components/schemas/Ulid"
    Range:
      name: Range
      in: header
      required: false
      description: |
        Optional single RFC byte range. Multiple or malformed ranges are
        ignored and receive the complete representation.
      schema:
        type: string
      example: bytes=0-1048575
    IfRange:
      name: If-Range
      in: header
      required: false
      description: |
        Strong lesson-video ETag returned by an earlier response. The range
        is honored only on an exact strong match; weak tags and dates receive
        the complete representation.
      schema:
        type: string
      example: '"0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"'
  headers:
    CorrelationId:
      required: true
      description: UUID that correlates the response with privacy-safe logs.
      schema:
        type: string
        format: uuid
    NoStore:
      required: true
      description: |
        Includes the `no-store` cache-control directive so intermediaries do
        not cache operational or identity state. Other defensive directives
        may also be present.
      schema:
        type: string
        pattern: '(^|,\s*)no-store(\s*,|$)'
    AcceptByteRanges:
      required: true
      description: The lesson-video endpoint accepts byte ranges.
      schema:
        type: string
        const: bytes
    LessonVideoEntityTag:
      required: true
      description: Strong entity tag derived from the governed SHA-256.
      schema:
        type: string
        pattern: '^"[0-9a-f]{64}"$'
    SatisfiedContentRange:
      required: true
      description: Inclusive served byte offsets and complete object length.
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    UnsatisfiedContentRange:
      required: true
      description: Complete object length for an unsatisfiable range.
      schema:
        type: string
        pattern: '^bytes \*/[0-9]+$'
  responses:
    Problem:
      description: The request could not be completed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
    OrganizationAdministrationProblem:
      description: The organization-administration request could not be completed.
      headers:
        X-Correlation-ID:
