            - 'null'
          enum:
            - audio/wav
            - null
        guidance_audio_base64:
          type:
            - string
            - 'null'
          description: |
            Optional base64 WAV for session /speech guidance lines only.
        guidance_audio_mime_type:
          type:
            - string
            - 'null'
          enum:
            - audio/wav
            - null
        model_audio_stream_path:
          type:
            - string
            - 'null'
          description: Authenticated private stream for the English reply.
        guidance_audio_stream_path:
          type:
            - string
            - 'null'
          description: Authenticated private stream for deferred L1 guidance.
        guidance_speech_status:
          type: string
          enum:
            - ready
            - deferred
            - unavailable
        model_avatar_viseme_timeline:
          oneOf:
            - $ref: "#/components/schemas/AvatarVisemeTimeline"
            - type: "null"
          description: |
            Optional viseme timeline aligned to model audio for Swathi lip sync.
        guidance_avatar_viseme_timeline:
          oneOf:
            - $ref: "#/components/schemas/AvatarVisemeTimeline"
            - type: "null"
          description: |
            Optional viseme timeline aligned to guidance audio for Swathi lip sync.
    SpeechLatencySampleRequest:
      type: object
      additionalProperties: false
      required:
        - client_runtime
        - network_class
        - playback_outcome
      properties:
        client_runtime:
          type: string
          enum:
            - web
            - android
        network_class:
          type: string
          enum:
            - unknown
            - wifi
            - cellular
            - ethernet
          description: Coarse client-provided class; no carrier, SSID or address.
        playback_outcome:
          type: string
          enum:
            - started
            - unavailable
            - failed
            - cancelled
        release_to_ack_ms:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 120000
          description: |
            Monotonic client-clock duration from explicit learner release or
            recording stop to receipt of an API acknowledgement. Null means
            this client path did not expose a distinct acknowledgement.
        release_to_first_signal_ms:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 120000
          description: |
            Monotonic client-clock duration from explicit learner release or
            recording stop to the first substantive response signal. A local
            listening/processing animation is not a substantive signal.
        release_to_first_audio_ms:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 120000
          description: |
            Monotonic client-clock duration from explicit learner release or
            recording stop until the main reply actually begins playback.
            Required by runtime validation when playback_outcome is started.
        turn_json_to_first_audio_ms:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 120000
          description: |
            Monotonic client-clock duration from receipt of the validated turn
            JSON until the main reply actually begins playback.
