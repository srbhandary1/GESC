    VoiceRecording:
      type: object
      additionalProperties: false
      required:
        - byte_size
        - codec
        - created_at
        - deletion_url
        - duration_ms
        - id
        - mime_type
        - replayed
        - source_deleted
        - status
        - transcript
        - transcript_confidence
        - transcript_review_url
      properties:
        byte_size:
          type: integer
          minimum: 44
          maximum: 10485760
        codec:
          type: string
          const: pcm_s16le
        created_at:
          type: string
          format: date-time
        deletion_url:
          type: string
          pattern: "^/api/v1/voice-recordings/[0-9A-HJKMNP-TV-Z]{26}/deletion$"
        duration_ms:
          type: integer
          minimum: 1
          maximum: 120000
        id:
          $ref: "#/components/schemas/Ulid"
        mime_type:
          type: string
          const: audio/wav
        replayed:
          type: boolean
        source_deleted:
          type: boolean
        status:
          type: string
          enum:
            - processing
            - awaiting_learner_confirmation
            - confirmed
            - corrected
            - discarded
            - provider_failed_recoverable
            - expired_deleted
            - withdrawn_deleted
        transcript:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 500
        transcript_confidence:
          type:
